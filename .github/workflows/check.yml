name: Checks

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable; compiler version is configured below
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: npm ci
      - name: Audit action runtimes including composite dependencies
        run: npm run check:actions
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo fmt --all -- --check
      - run: npm run build
      - run: npm run check
      - run: npm run test:wasm
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/
            test-results/

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable; compiler version is configured below
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: |
            target/release/cross-math
            target/release/cross-math.exe
